---
# Stockage local pour les données du Hub Beszel (base SQLite, config PocketBase).
#
# ⚠️ ADAPTE : le Hub est épinglé sur worker-1 par cohérence avec le stockage existant.
# Si tu préfères un autre nœud, change la valeur ci-dessous ET le nodeSelector du Deployment.
#
# Avant de déployer : créer le répertoire sur le nœud hôte :
#   ssh worker-1 "sudo mkdir -p /data/beszel && sudo chown 1000:1000 /data/beszel"
apiVersion: v1
kind: PersistentVolume
metadata:
  name: beszel-hub-pv
  labels:
    app.kubernetes.io/name: beszel
    app.kubernetes.io/part-of: homelab
    volume: beszel-hub-data
    app: beszel-hub
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/beszel
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker-1  # ⚠️ ADAPTE : hostname du nœud cible (kubectl get nodes)
