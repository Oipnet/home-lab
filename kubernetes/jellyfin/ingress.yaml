---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: homelab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: jellyfin-vpn-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.forelse.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: jellyfin-http
  tls:
    - hosts:
        - jellyfin.forelse.fr
      # Pas de secretName : Traefik gère le certificat via ACME (acme.json sur le PV)
