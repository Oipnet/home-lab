---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
    spec:
      # Épingler sur le nœud avec stockage local (worker-1)
      nodeSelector:
        storage: plex

      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: jellyfin-http
              containerPort: 8096
              protocol: TCP

          env:
            - name: TZ
              value: "Europe/Paris"
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jellyfin.forelse.fr"

          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-media
              mountPath: /media
            - name: jellyfin-cache
              mountPath: /cache

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi

          livenessProbe:
            httpGet:
              path: /health
              port: jellyfin-http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: jellyfin-http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: jellyfin-media
          persistentVolumeClaim:
            claimName: jellyfin-media-pvc
        - name: jellyfin-cache
          hostPath:
            path: /data/jellyfin/cache
            type: DirectoryOrCreate
