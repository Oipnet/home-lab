---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab

---
# ClusterRole en lecture seule — Homepage a besoin de lire les Ingress (auto-discovery),
# les Pods/Deployments/DaemonSets/StatefulSets (statuts), et les Nodes (widget cluster).
# Aucun accès en écriture, aucun accès aux Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-reader
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-reader
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-reader
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
