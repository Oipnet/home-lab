---
# Middleware Traefik : restreint l'accès aux IPs VPN WireGuard + LAN uniquement.
# Dupliqué dans le namespace homepage pour être référencé par l'Ingress Homepage.
# La référence dans l'Ingress sera : homepage-vpn-only@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vpn-only
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab
spec:
  ipAllowList:
    sourceRange:
      - 10.200.0.0/16   # WireGuard VPN (site-to-site + peers utilisateurs)
      - 192.168.1.0/24  # LAN local (si Freebox route sans NAT)
