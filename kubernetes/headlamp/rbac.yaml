---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: homelab

---
# ClusterRoleBinding — donne à Headlamp un accès lecture seule au cluster
# Pour un homelab on peut monter à cluster-admin, mais view suffit pour naviguer
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view          # built-in read-only sur toutes les ressources non-sensibles
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
