---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      volume: config
      app: plex

---
# plex-media-pvc — lie au PV NFS (persistent-volume-nas.yaml).
# La médiathèque est hébergée sur le NAS Synology via le tunnel OpenVPN tun0.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-media-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 10Ti
  selector:
    matchLabels:
      volume: media
      app: plex
      storage-type: nfs
