---
# ClusterIP service — internal cluster access
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
spec:
  selector:
    app: plex
  ports:
    - name: plex-web
      port: 32400
      targetPort: plex-web
      protocol: TCP
  type: ClusterIP


---
# (Optional) WireGuard-restricted external access
# Use this only if exposing Plex through the wg1 VPN gateway.
# Clients connect to 10.201.0.1:32400 through WireGuard.
apiVersion: v1
kind: Service
metadata:
  name: plex-wireguard
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
    access: wireguard
spec:
  selector:
    app: plex
  ports:
    - name: plex-web
      port: 32400
      targetPort: plex-web
      protocol: TCP
  type: ClusterIP
  # Traffic arrives via WireGuard on the node → iptables forwards to ClusterIP
