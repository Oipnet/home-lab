---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate          # Plex ne supporte pas plusieurs réplicas sur le même config
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      # Plex est épinglé sur le worker labellisé storage=plex
      # (celui qui porte les PersistentVolumes locaux)
      nodeSelector:
        storage: plex

      containers:
        - name: plex
          image: plexinc/pms-docker:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: plex-web
              containerPort: 32400
              protocol: TCP
            - name: dlna-tcp
              containerPort: 32469
              protocol: TCP
            - name: dlna-udp
              containerPort: 1900
              protocol: UDP
            - name: gdm-1
              containerPort: 32410
              protocol: UDP
            - name: gdm-2
              containerPort: 32412
              protocol: UDP
            - name: gdm-3
              containerPort: 32413
              protocol: UDP
            - name: gdm-4
              containerPort: 32414
              protocol: UDP

          env:
            - name: TZ
              value: "Europe/Paris"
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: plex-claim-token
                  key: PLEX_CLAIM
                  optional: true    # non requis après le premier claim
            - name: ADVERTISE_IP
              value: "http://10.201.0.1:32400/"   # IP WireGuard VPN pour les clients externes

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"

          volumeMounts:
            - name: plex-config
              mountPath: /config
            - name: plex-media
              mountPath: /data
            - name: transcode
              mountPath: /transcode

          livenessProbe:
            httpGet:
              path: /identity
              port: plex-web
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /identity
              port: plex-web
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

      volumes:
        - name: plex-config
          persistentVolumeClaim:
            claimName: plex-config-pvc
        - name: plex-media
          persistentVolumeClaim:
            claimName: plex-media-pvc
        - name: transcode
          emptyDir:
            sizeLimit: 20Gi
