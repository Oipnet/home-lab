---
# PersistentVolumes locaux (hostPath) sur worker-1 (labellisé storage=plex).
# Le répertoire /data/plex est créé par le playbook Ansible common.yml.
#
# Note : seul plex-config-pv est défini ici (stockage local rapide).
# La médiathèque (plex-media) est hébergée sur le NAS via NFS :
#   → kubernetes/plex/persistent-volume-nas.yaml

# ── Config Plex ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-config-pv
  labels:
    app: plex
    volume: config
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/plex/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage
              operator: In
              values:
                - plex
