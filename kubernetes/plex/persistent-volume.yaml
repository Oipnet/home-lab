---
# PersistentVolumes hostPath sur worker-1 (labellisé storage=plex).
# Le répertoire /data/plex est créé par le playbook Ansible common.yml.

# ── Config Plex ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-config-pv
  labels:
    app: plex
    volume: config
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/plex/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage
              operator: In
              values:
                - plex

---
# ── Médiathèque Plex ──────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media-pv
  labels:
    app: plex
    volume: media
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/plex/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage
              operator: In
              values:
                - plex
