---
# Non-sensitive defaults shared across all hosts.
# Sensitive values (keys, passwords) go in group_vars/all/vault.yml (ansible-vault).

k8s_version: "1.29"
pod_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

# WireGuard — Plex client VPN (wg0)
wg_plex_vpn_port: 51820
wg_plex_vpn_cidr: "10.201.0.0/24"

# Stockage Plex sur le nœud dédié
plex_data_path: "/data/plex"
plex_worker_label: "storage=plex"
