---
# WireGuard VPN — accès externe Plex (wg0)
# Le control plane agit comme serveur VPN.
# Chaque client autorisé obtient un [Peer] et accède à Plex via 10.201.0.1:32400.

- name: Configure WireGuard — Plex client VPN (wg0)
  hosts: control_plane
  become: true
  gather_facts: true

  vars:
    wg_interface: wg0
    wg_port: "{{ wg_plex_vpn_port }}"
    wg_server_address: "10.201.0.1/24"
    wg_config_path: "/etc/wireguard/{{ wg_interface }}.conf"

  tasks:
    - name: Ensure WireGuard is installed
      apt:
        name: wireguard
        state: present

    - name: Generate WireGuard private key if absent
      shell: wg genkey | tee /etc/wireguard/{{ wg_interface }}.key
      args:
        creates: /etc/wireguard/{{ wg_interface }}.key

    - name: Secure private key file
      file:
        path: /etc/wireguard/{{ wg_interface }}.key
        mode: "0600"

    - name: Read private key
      slurp:
        src: /etc/wireguard/{{ wg_interface }}.key
      register: wg_privkey_b64

    - name: Derive public key
      shell: echo "{{ wg_privkey_b64.content | b64decode | trim }}" | wg pubkey
      register: wg_pubkey
      changed_when: false

    - name: Show server public key
      debug:
        msg: >-
          WireGuard public key du serveur Plex VPN : {{ wg_pubkey.stdout }}
          — à copier dans les configs clients (gen-wireguard-client.sh).

    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/wireguard.conf
        reload: true

    - name: Write wg0 config
      copy:
        dest: "{{ wg_config_path }}"
        mode: "0600"
        content: |
          [Interface]
          Address    = {{ wg_server_address }}
          PrivateKey = {{ wg_privkey_b64.content | b64decode | trim }}
          ListenPort = {{ wg_port }}

          # NAT : les clients VPN accèdent à Plex via le cluster
          PostUp   = iptables -t nat -A POSTROUTING -s 10.201.0.0/24 -o eth0 -j MASQUERADE
          PostDown = iptables -t nat -D POSTROUTING -s 10.201.0.0/24 -o eth0 -j MASQUERADE

          # ── Ajouter un bloc [Peer] par client (via gen-wireguard-client.sh) ──
          # [Peer]
          # # laptop
          # PublicKey  = CLIENT_PUBLIC_KEY
          # AllowedIPs = 10.201.0.2/32
      notify: Restart wg0

    - name: Enable and start WireGuard
      systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: started
        enabled: true

    - name: Verify tunnel is up
      command: wg show {{ wg_interface }}
      register: wg_status
      changed_when: false

    - name: Display tunnel status
      debug:
        var: wg_status.stdout_lines

  handlers:
    - name: Restart wg0
      systemd:
        name: wg-quick@wg0
        state: restarted
