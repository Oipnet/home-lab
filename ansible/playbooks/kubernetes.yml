---
# ── Step 1: Initialize the control plane ─────────────────────────────────────
- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  gather_facts: true

  vars:
    pod_cidr: "10.244.0.0/16"          # Flannel default
    service_cidr: "10.96.0.0/12"
    kubeadm_config_path: /tmp/kubeadm-config.yaml

  tasks:
    - name: Check if cluster already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_conf

    - name: Write kubeadm configuration
      copy:
        dest: "{{ kubeadm_config_path }}"
        content: |
          apiVersion: kubeadm.k8s.io/v1beta3
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "{{ ansible_default_ipv4.address }}"
            bindPort: 6443
          nodeRegistration:
            criSocket: unix:///run/containerd/containerd.sock
          ---
          apiVersion: kubeadm.k8s.io/v1beta3
          kind: ClusterConfiguration
          kubernetesVersion: stable
          networking:
            podSubnet: "{{ pod_cidr }}"
            serviceSubnet: "{{ service_cidr }}"
          ---
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          cgroupDriver: systemd
      when: not kubeadm_conf.stat.exists

    - name: Initialize cluster with kubeadm
      command: kubeadm init --config {{ kubeadm_config_path }} --upload-certs
      register: kubeadm_init
      when: not kubeadm_conf.stat.exists

    - name: Set up kubectl for root
      file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy admin.conf to root's kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: Install Flannel CNI
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      register: flannel_result
      changed_when: "'created' in flannel_result.stdout or 'configured' in flannel_result.stdout"

    - name: Get join command for workers
      command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Store join command as fact
      set_fact:
        worker_join_command: "{{ join_command.stdout }}"

    - name: Fetch kubeconfig locally
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../../.kube/config"
        flat: true
      when: inventory_hostname == groups['control_plane'][0]

# ── Step 2: Join worker nodes ─────────────────────────────────────────────────
- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  gather_facts: true

  tasks:
    - name: Check if already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join the cluster
      command: "{{ hostvars[groups['control_plane'][0]]['worker_join_command'] }}"
      when: not kubelet_conf.stat.exists

    - name: Label worker nodes
      delegate_to: "{{ groups['control_plane'][0] }}"
      command: "kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker=worker --overwrite"
      changed_when: true

    - name: Label all workers as Traefik ingress nodes
      delegate_to: "{{ groups['control_plane'][0] }}"
      command: "kubectl label node {{ inventory_hostname }} ingress=traefik --overwrite"
      changed_when: true

    - name: Label worker-1 as Plex storage node
      delegate_to: "{{ groups['control_plane'][0] }}"
      command: "kubectl label node {{ groups['workers'][0] }} storage=plex --overwrite"
      when: inventory_hostname == groups['workers'][0]
      changed_when: true

    - name: Create Traefik ACME data directory on workers
      file:
        path: /data/traefik/acme
        state: directory
        mode: "0700"
