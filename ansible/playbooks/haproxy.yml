---
- name: Configure HAProxy load balancer
  hosts: load_balancers
  become: true
  gather_facts: true

  vars:
    haproxy_stats_port: 8404

  tasks:
    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: true

    - name: Deploy HAProxy configuration
      template:
        src: "{{ playbook_dir }}/../templates/haproxy.cfg.j2"
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: haproxy -c -f %s
      notify: Reload HAProxy

    - name: Enable and start HAProxy
      systemd:
        name: haproxy
        state: started
        enabled: true

  handlers:
    - name: Reload HAProxy
      systemd:
        name: haproxy
        state: reloaded
