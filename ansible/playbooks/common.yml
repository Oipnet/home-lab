---
- name: Common node configuration
  hosts: k8s_cluster
  become: true
  gather_facts: true

  vars:
    k8s_version: "1.29"

  tasks:
    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Add /etc/hosts entries for cluster nodes
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item]['ansible_host'] }} {{ item }}"
        state: present
      loop: "{{ groups['k8s_cluster'] }}"

    - name: Disable swap permanently
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Disable swap now
      command: swapoff -a
      changed_when: false

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Configure sysctl for Kubernetes
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "net.ipv4.ip_forward",                 value: "1" }

    - name: Install common packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - wireguard
          - nfs-common
          - open-iscsi
          - jq
        state: present
        update_cache: true

    # ── containerd ────────────────────────────────────────────────────────
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64','amd64') }}
          signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install containerd
      apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable and start containerd
      systemd:
        name: containerd
        state: started
        enabled: true

    # ── Kubernetes binaries ────────────────────────────────────────────────
    - name: Add Kubernetes GPG key
      apt_key:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Add Kubernetes repository
      apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
          https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /
        filename: kubernetes
        state: present

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - "kubelet"
          - "kubeadm"
          - "kubectl"
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: true

    # ── Stockage local Plex (uniquement sur le nœud labellisé storage=plex) ───
    - name: Create Plex data directories on workers
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ plex_data_path }}/config"
        - "{{ plex_data_path }}/media"
      when: inventory_hostname in groups['workers']
      # Les dossiers sont créés sur tous les workers.
      # Le nodeSelector (storage=plex) sur le Deployment garantit que seul
      # le worker labellisé recevra le pod Plex.

  handlers:
    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
